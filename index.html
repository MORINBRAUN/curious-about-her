<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Curious About Her</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;600;700;800&family=Heebo:wght@200;400;500;600;700;800&display=swap">
<style>
/* Layout: one phone screen at a time; his side deep black with crimson, hers light pink Soft UI. */
/* Tokens: DESIGN.md "Her Light, His Night". His side = default (night), her side = body.her (light pink). */
:root {
  --lat: "Manrope", "Heebo", -apple-system, "Segoe UI", sans-serif;
  --heb: "Heebo", "Manrope", -apple-system, "Segoe UI", sans-serif;
  --grad: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
  --pink: #f7b8d4; --herink: #4a0f2c;
  --bg: #0d0d12; --card: #17171f; --ink: #fbf8fa; --muted: #c3bac6; --line: #2a2530; --acc: #f9a8d4; --fill: #8b5cf6; --soft: rgba(139,92,246,.16);
  --tipbg: #17141f; --tipink: #fbf8fa; --o1: #8b5cf6; --o2: #ec4899; --oo: 0; --field: #17171f;
  --hi: #1f1c24; --lo: #000; --tile: #17171f; --well: #121219;
  --raise: 8px 8px 18px var(--lo), -4px -4px 12px var(--hi);
  --press: inset 5px 5px 12px var(--lo), inset -3px -3px 8px var(--hi);
  color-scheme: dark;
}
body.her {
  --grad: linear-gradient(140deg, #d63882 0%, #a3197a 100%);
  --pink: #f39ac4;
  --bg: #ffffff; --card: #ffffff; --ink: #33182f; --muted: #634a5e; --line: #ecdbe5; --acc: #c21d6e; --fill: #c21d6e; --soft: #fbd9ea;
  --tipbg: #f4dff3; --tipink: #33182f; --o1: #f39ac4; --o2: #7d6cf0; --oo: 0; --field: #fdf6fa;
  --hi: #ffffff; --lo: #ead7e3; --tile: linear-gradient(145deg, #fdeaf3, #f8e6f5); --well: #ffffff;
  --raise: 8px 8px 18px var(--lo), -8px -8px 18px var(--hi);
  --press: inset 5px 5px 12px var(--lo), inset -5px -5px 12px var(--hi);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
html { background: #0d0d12; } html:has(> body.her) { background: #ffffff; }
body { background: var(--bg); color: var(--ink); font: 500 16.5px/1.5 var(--lat); }
body[lang="en"], .en { font-family: var(--lat); }
body[dir="rtl"] { font-family: var(--heb); }
#app { position: relative; max-width: 480px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; overflow: hidden;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 12px; }
#app > * { position: relative; }
/* Inner screens (chat 6, prototype "Thread"): same materials as the homes. Raised = tappable, inset = fields and info. */
.top { display: flex; justify-content: space-between; align-items: center; min-height: 46px; }
.lab { font-size: 15.5px; font-weight: 700; letter-spacing: .02em; color: var(--acc); margin: 0; }
body:not(.her) .lab { color: var(--muted); }
.mutedlab { color: var(--muted); }
.big { font-weight: 800; font-size: 28px; line-height: 1.2; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.mid { font-weight: 800; font-size: 22px; line-height: 1.25; margin: 0; text-wrap: balance; }
body[dir="rtl"] .big, body[dir="rtl"] .mid { letter-spacing: 0; }
.brand { font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: -.03em; margin: 0; }
select.sel { width: 100%; font: inherit; font-size: 16.5px; color: var(--ink); background: var(--well); border: 0; border-radius: 20px; padding: 14px 16px; box-shadow: var(--press); appearance: auto; }
.howto { align-self: flex-start; max-width: 94%; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 22px 22px 22px 6px; background: var(--tipbg); border: 1px solid rgba(139,92,246,.35); }
[dir="rtl"] .howto { border-radius: 22px 22px 6px 22px; }
body.her .howto { border: 0; background: linear-gradient(145deg, #f4dff3, #ead3f0); }
.howto small { font-size: 15px; font-weight: 700; color: var(--acc); }
.ctx { font-size: 16.5px; font-weight: 500; line-height: 1.45; color: var(--ink); margin: 0; }
.gain { font-size: 16px; line-height: 1.45; color: var(--muted); margin: 0; }
.gain span { font-weight: 700; color: var(--acc); margin-inline-end: 6px; }
.gain.big2 { font-size: 18px; }
.explain { font-weight: 700; font-size: 26px; line-height: 1.25; margin: 0; }
.storycard { border-radius: 22px; padding: 16px; background: var(--tile); display: flex; flex-direction: column; gap: 10px; }
.storycard .t { font-weight: 600; font-size: 17.5px; line-height: 1.4; }
.srow { font-size: 16px; line-height: 1.45; }
.srow span { display: block; font-size: 15px; font-weight: 700; color: var(--muted); }
.edit { font: inherit; font-size: 15.5px; font-weight: 700; color: var(--acc); background: none; border: 0; padding: 0 4px; cursor: pointer; margin-inline-start: 6px; }
body:not(.her) .edit { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats div { border-radius: 22px; padding: 14px 6px; text-align: center; background: var(--bg); box-shadow: var(--press); }
.stats b { display: block; font-weight: 800; font-size: 30px; line-height: 1.1; background: linear-gradient(90deg, #d63882, #7d6cf0); -webkit-background-clip: text; background-clip: text; color: transparent; }
body:not(.her) .stats b { background: none; color: var(--ink); }
.stats small { font-size: 15.5px; color: var(--muted); }
.txt { font-size: 16px; line-height: 1.5; color: var(--muted); margin: 0; }
.center { text-align: center; }
.chip { width: 100%; text-align: start; font: inherit; font-weight: 700; font-size: 16.5px; color: var(--ink); background: var(--card); border: 0; border-radius: 20px; padding: 14px 16px; display: flex; justify-content: space-between; gap: 10px; align-items: center; cursor: pointer; box-shadow: var(--raise); transition: transform .15s ease-out; }
.chip:active { transform: scale(.97); }
.chip.sel, .chip.rec { background: linear-gradient(140deg, rgba(139,92,246,.32), rgba(139,92,246,.1)), var(--card); }
body.her .chip.sel, body.her .chip.rec { background: linear-gradient(145deg, #fbd9ea, #f3cfe6); }
div.chip { cursor: default; box-shadow: none; font-weight: 500; background: var(--tile); }
div.chip:active { transform: none; }
.chip small { color: var(--muted); font-size: 15.5px; font-weight: 500; white-space: nowrap; }
.pill { font-size: 15px; font-weight: 700; color: var(--acc); white-space: nowrap; padding: 3px 10px; border-radius: 999px; background: var(--soft); }
body:not(.her) .pill { color: var(--ink); }
.list { display: flex; flex-direction: column; gap: 10px; }
.fieldwrap { position: relative; }
textarea, input[type=text] { width: 100%; font: inherit; font-size: 16.5px; color: var(--ink); background: var(--well); border: 0; border-radius: 20px; padding: 14px 16px; outline: none; box-shadow: var(--press); }
textarea { min-height: 100px; resize: none; line-height: 1.45; }
textarea:focus, input:focus { box-shadow: var(--press), 0 0 0 2px var(--fill); }
::placeholder { color: var(--muted); opacity: .9; }
.fieldwrap textarea, .fieldwrap input { padding-inline-end: 52px; }
.mic { position: absolute; inset-inline-end: 8px; top: 8px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.mic svg { width: 20px; height: 20px; }
.mic.on { background: var(--grad); color: #fff; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(139,92,246,.18); } }
.btn { width: 100%; font: inherit; font-weight: 800; font-size: 18px; color: #fff; background: var(--grad); border: 0; border-radius: 24px; padding: 16px; cursor: pointer; box-shadow: var(--raise); transition: transform .15s ease-out; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; box-shadow: none; transform: none; }
.ghost { width: 100%; font: inherit; font-weight: 700; font-size: 16px; color: var(--muted); background: none; border: 0; padding: 12px; cursor: pointer; }
.push { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.sealed { border-radius: 22px; padding: 18px 16px; background: var(--card); border-inline-start: 4px solid #f7b8d4; box-shadow: 0 0 34px rgba(247,184,212,.14); }
.sealed .blur, .bub .blur { filter: blur(7px); font-weight: 600; font-size: 18px; line-height: 1.4; user-select: none; }
.row2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.quote { border-radius: 22px; padding: 16px 18px; background: var(--tile); font-weight: 500; font-size: 18px; line-height: 1.45; white-space: pre-wrap; }
.box { border-radius: 20px; padding: 14px 16px; background: var(--well); box-shadow: var(--press); font-size: 16px; line-height: 1.55; }
.box b { font-weight: 700; color: var(--acc); }
body:not(.her) .box b { color: var(--ink); }
.tip { background: var(--tipbg); color: var(--tipink); border-radius: 20px; padding: 14px 16px; font-size: 16px; line-height: 1.45; }
body:not(.her) .tip { border: 1px solid rgba(139,92,246,.35); }
.score { font-size: 16px; font-weight: 700; color: var(--acc); }
.sum { border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.45; background: var(--tile); }
.sum span { display: block; font-size: 15px; font-weight: 700; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chips button { font: inherit; font-weight: 700; font-size: 16px; color: var(--ink); background: var(--card); border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; box-shadow: 4px 4px 10px var(--lo), -4px -4px 10px var(--hi); transition: transform .15s ease-out; }
.chips button:active { transform: scale(.97); }
.chips button.sel { background: var(--grad); color: #fff; box-shadow: none; }
.starters button { text-align: start; font-weight: 500; font-size: 16px; border-radius: 18px; }
.hearts { display: flex; gap: 12px; }
.hearts button { font-size: 40px; line-height: 1; background: none; border: 0; padding: 0; cursor: pointer; color: var(--line); }
.hearts button.on { color: var(--fill); text-shadow: 0 0 16px rgba(139,92,246,.45); }
.steps { display: flex; flex-direction: column; gap: 10px; margin-top: 30px; }
.steps span { display: flex; align-items: center; background: var(--card); border-radius: 20px; padding: 14px 16px; font-weight: 600; font-size: 17.5px; line-height: 1.35; box-shadow: var(--raise); }
.steps b { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--grad); color: #fff; font-size: 15px; font-weight: 800; margin-inline-end: 12px; }
.bars { display: flex; align-items: flex-end; gap: 12px; height: 160px; margin: 40px 10px 10px; padding: 16px; border-radius: 26px; background: var(--card); box-shadow: var(--raise); }
.bars i { flex: 1; border-radius: 10px 10px 4px 4px; background: linear-gradient(180deg, #8b5cf6, #ec4899); }
body.her .bars i { background: linear-gradient(180deg, #f39ac4, #7d6cf0); }
.art { width: 180px; height: 180px; margin: 44px auto 0; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: 12px 12px 26px var(--lo), -6px -6px 16px var(--hi); }
.art span { width: 124px; height: 124px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: radial-gradient(70% 70% at 50% 20%, rgba(139,92,246,.55), rgba(139,92,246,0) 70%), var(--bg); box-shadow: inset 6px 6px 14px var(--lo), inset -4px -4px 10px var(--hi); }
body.her .art { border-radius: 34px; background: var(--bg); box-shadow: 14px 14px 30px var(--lo), -14px -14px 30px var(--hi); }
body.her .art span { width: 156px; height: 156px; border-radius: 24px; box-shadow: none; background: radial-gradient(60% 70% at 70% 30%, #7d6cf0 0%, rgba(125,108,240,0) 60%), radial-gradient(70% 70% at 30% 70%, #f39ac4 0%, rgba(243,154,196,0) 65%), linear-gradient(160deg, #f6b3cf, #c79bea); }
.art svg.i { width: 54px; height: 54px; stroke-width: 1.6; }
.dots { display: flex; gap: 6px; color: var(--fill); }
.dots i { width: 7px; height: 7px; border-radius: 7px; background: currentColor; opacity: .3; }
.dots i.on { width: 22px; opacity: 1; }
.mark { width: 62px; height: 62px; border-radius: 22px; background: var(--grad); display: grid; place-items: center; color: #fff; font-size: 28px; margin-top: 40px; box-shadow: var(--raise); }
.seg2 { display: flex; gap: 10px; }
.seg2 button { flex: 1; font: inherit; font-weight: 700; font-size: 16.5px; color: var(--ink); background: var(--card); border: 0; border-radius: 20px; padding: 14px; cursor: pointer; box-shadow: var(--raise); transition: transform .15s ease-out; }
.seg2 button:active { transform: scale(.97); }
.seg2 button.sel { background: var(--grad); color: #fff; box-shadow: none; }
.he { font-family: var(--heb); }
.iconbtn { font: inherit; font-weight: 700; font-size: 15.5px; color: var(--muted); background: var(--card); border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer; box-shadow: 4px 4px 10px var(--lo), -4px -4px 10px var(--hi); }
.empty { border-radius: 20px; padding: 16px; color: var(--muted); font-size: 16px; text-align: center; background: var(--bg); box-shadow: var(--press); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 11px 20px; font-size: 16px; font-weight: 700; z-index: 9; }
.fromcard { border-radius: 22px; padding: 16px 18px; background: var(--grad); color: #fff; box-shadow: var(--raise); display: flex; flex-direction: column; gap: 6px; text-align: start; width: 100%; border: 0; font: inherit; }
body:not(.her) .fromcard { background: var(--card); color: var(--ink); border-inline-start: 4px solid #f7b8d4; }
.fromcard .ft { font-size: 18px; line-height: 1.4; font-weight: 500; }
.fromcard .fl { font-size: 15.5px; font-weight: 700; display: flex; justify-content: space-between; opacity: .95; }
body:not(.her) .fromcard .fl { color: #f7b8d4; }
.fromcard .nw { background: #fff; color: #a3197a; border-radius: 999px; padding: 1px 10px; font-size: 15px; }
body:not(.her) .fromcard .nw { background: #f7b8d4; color: #4a0f2c; }
button.fromcard { cursor: pointer; }
.compose { background: var(--card); box-shadow: var(--raise); gap: 12px; }
.minisend { font: inherit; font-size: 15.5px; font-weight: 800; color: #fff; background: var(--grad); border: 0; border-radius: 999px; padding: 7px 13px; cursor: pointer; white-space: nowrap; }
.copybox { font-size: 15.5px; word-break: break-all; color: var(--muted); background: var(--well); box-shadow: var(--press); border-radius: 16px; padding: 12px; user-select: all; }
/* Moment thread: partner first (her mark on his side), your bubbles at the end, "your turn" box at the bottom */
.thread { display: flex; flex-direction: column; gap: 8px; }
.bub { max-width: 86%; padding: 12px 15px; font-size: 16.5px; line-height: 1.45; border-radius: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bub small { display: block; font-weight: 700; font-size: 15px; margin-bottom: 2px; color: var(--muted); }
.bub.p { align-self: flex-start; border-start-start-radius: 6px; background: var(--card); border-inline-start: 4px solid #f7b8d4; }
.bub.p small { color: #f7b8d4; }
.bub.me { align-self: flex-end; border-start-end-radius: 6px; background: #232033; }
body.her .bub.p { border: 0; background: var(--bg); box-shadow: 6px 6px 14px var(--lo), -6px -6px 14px var(--hi); }
body.her .bub.p small { color: var(--acc); }
body.her .bub.me { background: linear-gradient(145deg, #fbd9ea, #f3cfe6); }
.sys { align-self: center; max-width: 92%; text-align: center; font-size: 15.5px; font-weight: 700; padding: 6px 14px; border-radius: 999px; background: #120f14; color: var(--muted); }
body.her .sys { background: #fbf1f6; }
.turn { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 18px 16px; border-radius: 26px; background: var(--card); box-shadow: 0 -10px 30px rgba(0,0,0,.6), -4px -4px 12px var(--hi); }
body.her .turn { box-shadow: 10px 10px 24px var(--lo), -10px -10px 24px var(--hi); }
.turn .lab.tl { align-self: flex-start; }
body:not(.her) .turn .lab.tl { color: #fff; background: var(--fill); padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 15px; }
.acts { display: flex; flex-direction: column; gap: 10px; }
body:not(.her) .turn .chip, body:not(.her) .turn .chips button, body:not(.her) .turn .seg2 button { background-color: #1f1c2a; }
body:not(.her) .turn .chip.rec { background: linear-gradient(140deg, rgba(139,92,246,.36), rgba(139,92,246,.12)), #1f1c2a; }
body:not(.her) .turn textarea, body:not(.her) .turn input, body:not(.her) .turn .box, body:not(.her) .turn select.sel { background: #121219; }
.hlab .av { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #f7b8d4; color: #4a0f2c; font-weight: 800; font-size: 14px; vertical-align: middle; margin-inline-end: 8px; }
body.her .hlab .av { background: #2b1b29; color: #fff; }
/* Trail (chat 7): the round as a path of 7 stops. Done = one line (tap to open), now = raised card, next = greyed.
   Her stops carry her pink on his side (She-Is-the-Light Rule). */
.trail { position: relative; display: flex; flex-direction: column; gap: 4px; padding-inline-start: 28px; }
.trail::before { content: ""; position: absolute; inset-inline-start: 9px; top: 14px; bottom: 14px; width: 2px; border-radius: 2px; background: var(--line); }
.stop { position: relative; }
.stop::before { content: ""; position: absolute; inset-inline-start: -25px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
.stop.hers.done::before { background: #f7b8d4; }
body.her .stop.hers.done::before { background: var(--muted); }
body.her .stop.done:not(.hers)::before { background: #c9a9bd; }
.stop.now::before { background: var(--fill); box-shadow: 0 0 0 5px var(--soft); }
.stop.next::before { background: var(--bg); box-shadow: inset 0 0 0 2px var(--line); }
.stop .sn { display: block; margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.35; color: var(--muted); }
.stop.hers .sn { color: #f7b8d4; }
body.her .stop.hers .sn { color: var(--muted); }
.stop.now .sn { color: var(--acc); padding: 9px 0 6px; }
.stop.next .sn { padding: 6px 0; opacity: .75; }
.srow { width: 100%; display: flex; flex-direction: column; gap: 1px; text-align: start; font: inherit; color: var(--ink); background: none; border: 0; padding: 9px 0; cursor: pointer; }
.srow .sv { font-size: 16.5px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.srow[aria-expanded="true"] .sv { -webkit-line-clamp: unset; white-space: pre-wrap; }
.scard { display: flex; flex-direction: column; gap: 12px; padding: 18px 16px; margin-bottom: 8px; border-radius: 24px; background: var(--card); box-shadow: var(--raise); }
body:not(.her) .scard textarea, body:not(.her) .scard input { background: #121219; }
.scard.closed { margin-top: 6px; }
.scard .howto { max-width: 100%; }
.ropt { width: 100%; display: flex; flex-direction: column; gap: 2px; text-align: start; font: inherit; color: var(--ink); border: 0; border-radius: 20px; padding: 14px 16px; cursor: pointer; background: var(--card); box-shadow: var(--raise); transition: transform .15s ease-out; }
body:not(.her) .ropt { background: #1f1c2a; }
.ropt:active { transform: scale(.97); }
.ropt b { font-size: 17.5px; font-weight: 700; }
.ropt small { font-size: 15.5px; color: var(--muted); }
.ropt.first, body:not(.her) .ropt.first { background: var(--grad); color: #fff; }
.ropt.first small { color: rgba(255,255,255,.85); }
.rlead { margin: 0 0 -4px; font-size: 17.5px; font-weight: 800; color: var(--acc); }
.rwait { display: flex; align-items: center; gap: 12px; }
.rwait b { display: block; font-size: 17.5px; font-weight: 700; }
.rwait small { display: block; font-size: 15.5px; color: var(--muted); }
.dots3 { display: inline-flex; gap: 4px; flex: none; }
.dots3 i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .5; }
.rleft { margin: 4px 0 0; text-align: center; font-size: 15.5px; font-weight: 600; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .ropt { transition: none; } }
/* Conversations list: one raised row per moment; "your turn" rows lit (crimson on his side, rose on hers) */
.conv { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; border: 0; border-radius: 22px; font: inherit; color: var(--ink); text-align: start; background: var(--card); box-shadow: var(--raise); cursor: pointer; transition: transform .15s ease-out; }
.conv:active { transform: scale(.97); }
.conv .cav { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 17px; background: #2a2530; color: var(--ink); }

/* His Today (DESIGN.md): velvet black, crimson dial, coach first, small date link */
#app.night { gap: 16px; }
.tabs { display: flex; background: none; border: 0; padding: 0; gap: 18px; overflow-x: auto; scrollbar-width: none; }

.dial .badge { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); z-index: 2; font-weight: 800; font-size: 15px; padding: 5px 12px; border-radius: 999px; background: var(--fill); color: #fff; box-shadow: 0 6px 14px rgba(0,0,0,.6); }
.dial .stat { position: absolute; bottom: -14px; white-space: nowrap; font-size: 15.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: var(--card); color: var(--muted); box-shadow: 4px 4px 10px var(--lo); }
body:not(.her) .btn { font-weight: 800; font-size: 18px; border-radius: 22px; }
.cbub { align-self: flex-start; max-width: 92%; border-radius: 22px 22px 22px 6px; padding: 14px 16px; background: #17141f; border: 1px solid rgba(139,92,246,.35); font-size: 16.5px; line-height: 1.5; }

.htile:active, .dial:active, .datelink:active { transform: scale(.97); }

.datelink svg.i { width: 18px; height: 18px; }
/* Her home (DESIGN.md): soft raised shapes on white, pink fills, one focal card */
svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[dir="ltr"] svg.i path[d^="M15 6"], [dir="ltr"] svg.i path[d^="M9 6.5"] { transform: scaleX(-1); transform-origin: center; }
#app.soft { gap: 16px; }
.hbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rb { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; border: 0; padding: 0; background: var(--bg); color: var(--muted); box-shadow: 6px 6px 14px var(--lo), -6px -6px 14px var(--hi); cursor: pointer; }

  background: radial-gradient(60% 70% at 70% 30%, #7d6cf0 0%, rgba(125,108,240,0) 60%), radial-gradient(70% 70% at 30% 70%, #f39ac4 0%, rgba(243,154,196,0) 65%), linear-gradient(160deg, #f6b3cf, #c79bea); }

.cta2:active, .hli:active, .rb:active { transform: scale(.97); }

.learned b { color: var(--ink); font-weight: 800; }
.learned .tr { flex: 1; min-width: 60px; height: 8px; border-radius: 4px; position: relative; box-shadow: inset 2px 2px 4px var(--lo), inset -2px -2px 4px var(--hi); }
.learned .tr i { position: absolute; inset-inline-start: 0; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(90deg, #f39ac4, #7d6cf0); }
.hlist { display: flex; flex-direction: column; gap: 8px; }
.hli { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-radius: 20px; font: inherit; color: var(--ink); text-align: start; background: transparent; cursor: pointer; }
.hli:nth-child(odd) { background: linear-gradient(145deg, #fbd9ea, #f3cfe6); }
.hli:nth-child(even) { background: linear-gradient(145deg, #f4dff3, #ead3f0); }

.hli.on .pb { background: var(--fill); color: #fff; box-shadow: none; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { #app.anim { animation: in .3s ease; } @keyframes in { from { opacity: .3; transform: translateY(6px); } } }

/* v30: his side in the v22 colors too (violet → pink on purple-black). v29: one type system on both sides (thin v22 headings, bigger reading text). Her side: v22 colors; layout change (tiles) on her home only. His side keeps his colors. */
body.her {
  --grad: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
  --bg: #fdfbfe; --card: #ffffff; --ink: #2b1a3a; --muted: #6f5f80; --line: #ece2f5; --acc: #b5479a; --fill: #a855f7; --soft: #f3e8ff;
  --tipbg: #f7f0fd; --hi: #ffffff; --lo: #ece4f4; --well: #faf6fd; --tile: #ffffff;
}
html:has(> body.her) { background: #fdfbfe; }
#app, #app * { font-weight: 400; }
#app .big, #app .mid, #app .focal span, #app .brand, #app .dial .num, #app .dt { font-weight: 200; }
#app .big { font-size: 38px; line-height: 1.08; }
#app .mid { font-size: 31px; line-height: 1.15; }
#app .focal span { font-size: 32px; line-height: 1.15; }
#app .btn, #app .cta2, #app .ropt b, #app .hli b, #app .conv b, #app .tabs button.on, #app .pill, #app .st { font-weight: 500; }
#app .lab, #app .sn, #app .tl, #app .bub small, #app .howto small { font-weight: 500; letter-spacing: .04em; }
#app { font-size: 17.5px; }
#app .txt, #app .ctx, #app .bub, #app textarea, #app input[type=text], #app .sv, #app .tabs button { font-size: 18px; }
#app .lab, #app .sn, #app .hli small, #app .conv small, #app .focal small, #app .learned, #app .rleft, #app .bub small, #app .howto small { font-size: 17px; }
#app .hli b, #app .conv b, #app .fold .ft { font-size: 19.5px; }
#app .btn, #app .cta2 { font-size: 19px; }
/* layout changes on her home only; every other screen keeps the v25 layout */
body.her .focal { box-shadow: none; padding: 0; }
body.her .focal > div { background: linear-gradient(135deg, #c4b5fd 0%, #f9a8d4 100%) !important; }
/* her home: 2 x 2 tiles in pink and purple shades */
body.her .hlist { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
body.her .hli { min-height: 132px; flex-direction: column-reverse; align-items: flex-start; justify-content: space-between; padding: 16px; border-radius: 22px; box-shadow: none; }
body.her .hli:nth-child(1) { background: #fde0ef; } body.her .hli:nth-child(2) { background: #ebe2ff; }
body.her .hli:nth-child(3) { background: #f6dcf5; } body.her .hli:nth-child(4) { background: #e2dafc; }
body.her .hli .pb { box-shadow: none; background: rgba(255,255,255,.75); color: var(--acc); }
body.her .hli.on { box-shadow: none; }
body.her .hli.on .pb { background: #ec4899; color: #fff; }
/* v31: the intro-screens design on every screen (approved). Glow backgrounds, flat glassy cards with thin borders, no soft relief. */
body:not(.her) { --bg: #0d0d12; --card: rgba(255,255,255,.06); --line: rgba(255,255,255,.14); --well: rgba(255,255,255,.04); --tile: rgba(255,255,255,.06); --tipbg: rgba(255,255,255,.06); }
body.her { --bg: #ffffff; --card: rgba(255,255,255,.62); --line: #eadcf2; --well: rgba(255,255,255,.7); --tile: rgba(255,255,255,.62); --tipbg: rgba(255,255,255,.62); }
html, body { background: var(--bg) !important; }
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(260px 260px at 10% 12%, rgba(139,92,246,.55), transparent 70%), radial-gradient(240px 240px at 95% 30%, rgba(236,72,153,.45), transparent 70%), radial-gradient(220px 220px at 30% 85%, rgba(109,40,217,.35), transparent 70%); filter: blur(10px); }
body.her::before { background: radial-gradient(260px 260px at 10% 12%, rgba(249,168,212,.7), transparent 70%), radial-gradient(240px 240px at 95% 30%, rgba(196,181,253,.7), transparent 70%), radial-gradient(220px 220px at 30% 85%, rgba(251,207,232,.6), transparent 70%); }
#app { z-index: 1; background: transparent !important; }
#app *:not(.btn):not(.cta2):not(.ropt.first):not(.badge):not(.st):not(.pill) { box-shadow: none !important; }
#app .scard, #app .turn, #app .htile, #app .hli, #app .conv, #app .fold, #app .chip, #app .ropt:not(.first), #app .cbub, #app .howto, #app .box, #app textarea, #app input[type=text], #app .rb, #app .bub, #app .tabs, #app .storycard {
  background: var(--card) !important; border: 1px solid var(--line) !important; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#app .btn, #app .cta2 { border-radius: 16px; box-shadow: none !important; }
[dir="ltr"] #app .lab, [dir="ltr"] #app .sn { letter-spacing: .14em; text-transform: uppercase; } [dir="rtl"] #app .lab, [dir="rtl"] #app .sn, [dir="rtl"] #app .tl { letter-spacing: 0 !important; }
#app .tabs { border: 0 !important; background: transparent !important; backdrop-filter: none; }
#app .dial { background: rgba(255,255,255,.04) !important; border: 1px solid var(--line); }
#app .dial .in { background: transparent !important; }
#app .focal > div { background: transparent !important; }
#app .focal { background: transparent !important; border: 1px solid var(--line); height: auto; padding: 26px 18px; }
#app .focal span { color: var(--ink) !important; text-shadow: none !important; }
#app .focal::before { content: "♡"; display: block; text-align: center; font-size: 56px; line-height: 1; margin-bottom: 8px; color: var(--acc); }
body.her .hli:nth-child(n) { background: rgba(255,255,255,.62) !important; }
body.her .hli .pb { background: linear-gradient(135deg,#8b5cf6,#ec4899) !important; color: #fff !important; }
.trail::before { background: var(--line) !important; }

/* v31: less text on every screen. Explanations live behind a small "✦" chip (tap to open) and in Settings → How it works. */
#app > .big + .txt, #app > .mid + .txt, #app .scard .mid + .txt, #app .lab + .txt, #app .stats + .txt { display: none; }
#app .dhead .ds, #app .htile small, #app.soft > .hlab, #app .rleft, #app .gain { display: none; }
body.her .hli:nth-child(3) small, body.her .hli:nth-child(4) small { display: none; }
#app .scard.closed .mid + .txt { display: block; }
details.hint { align-self: flex-start; max-width: 100%; }
details.hint > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 15.5px; font-weight: 500; color: var(--acc); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); }
details.hint > summary::-webkit-details-marker { display: none; }
details.hint[open] > summary { margin-bottom: 8px; }
details.hint .howto small, details.hint .cbub small { display: none; }

/* The map tab (Deck): a stack of cards to flip; insights and whispers below. */
.deck { position: relative; height: 230px; margin-bottom: 18px; }
.dcard { position: absolute; inset: 0; padding: 20px; border-radius: 24px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; border: 1px solid var(--line); transition: transform 240ms cubic-bezier(.23,1,.32,1), opacity 240ms cubic-bezier(.23,1,.32,1); }
body:not(.her) .dcard { background: #18151f; } body.her .dcard { background: #ffffff; }
.dcard.p0 { z-index: 3; cursor: pointer; } .dcard.p1 { z-index: 2; transform: translateY(10px) scale(.95); opacity: .55; } .dcard.p2 { z-index: 1; transform: translateY(20px) scale(.9); opacity: .25; }
.dcard .q { font-weight: 200; font-size: 26px; line-height: 1.2; }
.dfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
.dnew { font-size: 13px; font-weight: 600; color: #fff; background: var(--grad); border-radius: 999px; padding: 2px 10px; }
.dnav { display: flex; align-items: center; justify-content: space-between; font-size: 15px; color: var(--muted); }
.dic { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.dic:active, .dcard.p0:active { transform: scale(.97); }
.dk-empty { padding: 16px; border-radius: 20px; border: 1px dashed var(--line); color: var(--muted); font-size: 16px; }
.ins { padding: 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; gap: 6px; }
.ins b { font-weight: 500; font-size: 17.5px; line-height: 1.4; }
.ins span { font-size: 16px; color: var(--muted); }
.ins i { font-style: normal; font-weight: 600; color: var(--acc); }
.wmsg { padding: 12px 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; gap: 6px; }
.wmsg.p { border-inline-start: 3px solid #f9a8d4; } body.her .wmsg.p { border-inline-start-color: var(--acc); }
.wmsg .k { font-size: 14px; font-weight: 600; color: var(--acc); }
.wmsg .t { font-size: 17px; line-height: 1.4; }
.wmsg .r { display: flex; gap: 8px; }
.wmsg .r button { font: inherit; font-size: 15px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.wmsg .r button.sel { background: var(--grad); color: #fff; border-color: transparent; }
.whbox { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); }
.whrow { display: flex; gap: 8px; flex-wrap: wrap; }
.wk { font: inherit; font-size: 16px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
.wk.on { background: var(--grad); color: #fff; border-color: transparent; }
@media (prefers-reduced-motion: reduce) { .dcard { transition: none; } }

/* Whispers (chat 7): her/his whispers as a deck; the invitation with two doors */
.wdeck { height: 220px; }
.dcard.ws { border-inline-start: 3px solid #f9a8d4; } body.her .dcard.ws { border-inline-start-color: var(--acc); }
.wsfrom { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; color: #f9a8d4; } body.her .wsfrom { color: var(--acc); }
.wsav { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: #f9a8d4; color: #4a0f2c; }
body.her .wsav { background: #2b1b29; color: #fff; }
.dcard.ws .q { font-size: 23px; }
.dcard.ws .r { display: flex; gap: 8px; }
.dcard.ws .r button { font: inherit; font-size: 15px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.invite { display: flex; flex-direction: column; gap: 12px; padding: 22px 18px; border-radius: 26px; border: 1px solid var(--line); background: linear-gradient(135deg, rgba(139,92,246,.22), rgba(236,72,153,.18)); }
.invite .iq { margin: 0; font-weight: 200; font-size: 28px; line-height: 1.15; }
#app .invite .txt { display: block; margin-top: -6px; }
.doors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.door { font: inherit; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; min-height: 104px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-align: start; font-size: 17px; font-weight: 500; transition: transform .15s ease-out; }
.door svg.i { width: 26px; height: 26px; color: var(--acc); }
.door.on { background: var(--grad); color: #fff; border-color: transparent; } .door.on svg.i { color: #fff; }
.door:active { transform: scale(.97); }

  app.querySelectorAll("[data-close]").forEach(function (b) { b.onclick = function () { var m = M(); if (!m) return; m.answerDraft = val("herAns"); var n = +b.dataset.close; m.closeDraft = m.closeDraft === n ? 0 : n; persist(); render(); }; });
  app.querySelectorAll("[data-reply]").forEach(function (b) { b.onclick = function () { var p = b.dataset.reply.split("|"), tp = (S.tips || []).filter(function (z) { return z.id === p[0]; })[0]; if (!tp) return; tp.myReply = tp.myReply === p[1] ? "" : p[1]; persist(); if (tp.myReply) send("tipReply", { id: tp.id, r: tp.myReply }, "wReply"); setTimeout(render, 300); }; });

  app.querySelectorAll("[data-fold]").forEach(function (b) { b.onclick = function () { b.setAttribute("aria-expanded", b.getAttribute("aria-expanded") === "true" ? "false" : "true"); }; });

  app.querySelectorAll("input[type=text]").forEach(function (i) { i.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); var b = i.closest(".fieldwrap") ? i.closest(".fieldwrap").nextElementSibling : null; if (b && b.classList.contains("btn")) b.click(); } }; });
}
