/* ===================== Links (messages travel after the #) ===================== */
function enc(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }

function baseUrl() { return location.origin + location.pathname; }
function send(type, data, waKey) {
  if (!S.couple) S.couple = uid();
  var msg = { v: 1, c: S.couple, id: uid(), t: type, f: S.role, n: S.me, l: S.lang, p: S.partner, d: data };
  var link = baseUrl() + "#m=" + enc(msg);

  V.lastLink = link;
  var text = t(waKey) + "\n" + link;
  var wa = "https://wa.me/?text=" + encodeURIComponent(text);

  if (!w) window.location.href = wa;

}
function receive() {
  var h = location.hash || "";

  if (i < 0) return false;
  var msg; try { msg = dec(h.slice(i + 2)); } catch (e) { return false; }
  history.replaceState(null, "", baseUrl());
  if (!msg || !msg.t) return false;
  if (!S.role) { V.pending = msg; if (msg.l && S.lang !== "he") S.lang = msg.l; V.screen = "whoLink"; return true; }
  if (msg.f === S.role) { V.screen = "notice"; V.tmp.notice = fill(raw("ownLink"), msg); return true; }
  if (S.couple && msg.c !== S.couple) { V.screen = "notice"; V.tmp.notice = t("otherCouple"); return true; }
  var already = S.seen.indexOf(msg.id) > -1;
  if (!S.couple) S.couple = msg.c;
  if (!S.role) { S.role = msg.f === "her" ? "him" : "her"; if (S.lang !== "he" && msg.l) S.lang = msg.l; }
  if (!S.partner && msg.n) S.partner = msg.n;

  if (!already) { S.seen.push(msg.id); if (S.seen.length > 300) S.seen = S.seen.slice(-300); apply(msg); }
  else route(msg);

}
function apply(msg) {
  var d = msg.d || {}, m;
  if (msg.t === "invite" || msg.t === "moment") {
    m = byId(d.mid);
    if (!m) { m = { id: d.mid, title: d.title, from: "her", status: "sealed", createdAt: Date.now() }; S.moments.unshift(m); }
  } else if (msg.t === "question") {
    m = byId(d.mid);
    if (!m) { m = { id: d.mid, title: d.title, from: d.from || "him", createdAt: Date.now() }; S.moments.unshift(m); }
    m.question = d.q; m.status = "asked"; m.title = m.title || d.title; if (d.guess) m.hisGuess = d.guess;
  } else if (msg.t === "answer") {
    m = byId(d.mid); if (m) { m.answer = d.a; m.status = "answered"; }
  } else if (msg.t === "note" || msg.t === "listened") {
    m = byId(d.mid);
    if (!m) { m = { id: d.mid, title: d.title, from: "him", createdAt: Date.now() }; S.moments.unshift(m); }
    m.status = "listened"; if (d.note) m.note = d.note; m.listenedAt = Date.now();
    if (d.q && !m.question) m.question = d.q; if (d.a && !m.answer) m.answer = d.a; if (d.guess) m.hisGuess = d.guess; if (d.draw) m.draw = d.draw;
  } else if (msg.t === "tip") {
    S.tips = S.tips || []; if (!S.tips.some(function (x) { return x.id === d.id; })) S.tips.unshift({ id: d.id, from: msg.f, text: d.text, createdAt: Date.now() });
  } else if (msg.t === "edit") {
    m = byId(d.mid); if (m) { if (d.field === "title") m.title = d.value; if (d.field === "answer") { m.answer = d.value; if (m.status === "asked") m.status = "answered"; } }
  } else if (msg.t === "reaction") {
    m = byId(d.mid); if (m) m.reaction = d.text;
  }
  route(msg);
  S.seenSteps = S.seenSteps || {};
  if (S.role === "him" && EXPLAIN[V.screen] && !S.seenSteps[V.screen]) { V.after = V.screen; V.screen = "explain"; }
}
function route(msg) {
  var d = msg.d || {};
  V.mid = d.mid;
  if (S.role === "him") {
    if (msg.t === "tip") { V.tab = "tips"; V.screen = "home"; return; }
    if (msg.t === "invite" || msg.t === "moment") V.screen = "sealed";
    else if (msg.t === "answer" || (msg.t === "edit" && (msg.d || {}).field === "answer" && byId(d.mid) && byId(d.mid).status !== "done")) V.screen = "learned";
    else V.screen = "home";
  } else {
    if (msg.t === "tip") { V.tab = "tips"; V.screen = "home"; return; }
    if (msg.t === "question") V.screen = S.introHer ? "answer" : "herIntro1";
    else if (msg.t === "note" || msg.t === "listened") V.screen = "listened";

function snap() { return { screen: V.screen, mid: V.mid, tab: V.tab, after: V.after }; }
function restore(h) { V.screen = h.screen; V.mid = h.mid; V.tab = h.tab; V.after = h.after; render(true); window.scrollTo(0, 0); }

  S.seenSteps = S.seenSteps || {};
