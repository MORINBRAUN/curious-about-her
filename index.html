/* Layout: one phone screen at a time; his side dark, hers white; violet-to-pink accent on both. */
:root {

  color-scheme: dark;
}
body.her {
  --bg: #fdfbfe; --card: #ffffff; --ink: #2b1a3a; --muted: #8a7798; --line: #ece2f5; --acc: #b5479a; --soft: #fbe6f3;
  --tipbg: #fff3e3; --tipink: #7a4f12; --o1: #f9a8d4; --o2: #c4b5fd; --oo: .6; --field: #faf6fd;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--lat); }

  display: flex; flex-direction: column; gap: 12px; }
#app > * { position: relative; }
.orb { position: absolute !important; border-radius: 50%; filter: blur(48px); pointer-events: none; opacity: var(--oo); z-index: 0; }
.o1 { width: 280px; height: 280px; background: var(--o1); top: -80px; inset-inline-start: -90px; }
.o2 { width: 260px; height: 260px; background: var(--o2); top: 180px; inset-inline-end: -120px; }
.calm .orb { opacity: calc(var(--oo) * .4); }
.top { display: flex; justify-content: space-between; align-items: center; min-height: 28px; }
.lab { font-size: 13px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--acc); margin: 0; }
body[dir="rtl"] .lab { letter-spacing: .03em; font-size: 14px; }
.mutedlab { color: var(--muted); }
.big { font-weight: 200; font-size: 34px; line-height: 1.08; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.mid { font-weight: 200; font-size: 27px; line-height: 1.15; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
body[dir="rtl"] .big, body[dir="rtl"] .mid { letter-spacing: 0; line-height: 1.18; }
.brand { font-weight: 200; font-size: 44px; line-height: 1; letter-spacing: -.03em; margin: 0; }
select.sel { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--field); border: 1px solid var(--acc); border-radius: 15px; padding: 13px 15px; appearance: auto; }
.starters button { text-align: start; font-size: 14px; border-style: dashed; }
.stepper { display: flex; align-items: center; gap: 8px; margin: -4px 0 4px; }
.sdots { flex: 1; display: flex; justify-content: space-between; gap: 4px; }
.sdot { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--field); color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; padding: 0; }
.sdot.done { color: var(--ink); border-color: var(--acc); }
.sdot.on { background: var(--grad); color: #fff; border-color: transparent; }
.snav { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--field); color: var(--ink); font-size: 20px; cursor: pointer; padding: 0; }
.snav:disabled { opacity: .3; }
.navrow { display: flex; justify-content: space-between; align-items: center; margin: -6px 0 2px; }
.navb { font: inherit; font-size: 15px; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.navb:disabled { opacity: .35; }
body[dir="rtl"] .navb { direction: rtl; }
.howto { border-radius: 18px; padding: 14px 16px; background: var(--soft); border-inline-start: 4px solid var(--pink); display: flex; flex-direction: column; gap: 8px; margin: 2px 0 6px; }
body.her .howto { border-inline-start-color: var(--acc); }
.ctx { font-size: 20px; font-weight: 400; line-height: 1.4; color: var(--ink); margin: 0; }
.gain { font-size: 17px; line-height: 1.4; color: var(--pink); margin: 0; }
body.her .gain { color: var(--acc); }
.gain span { display: block; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .8; margin-bottom: 2px; }
.gain.big2 { font-size: 22px; }
.explain { font-weight: 300; font-size: 34px; line-height: 1.2; margin: 0; }
.storycard { border: 1px solid var(--line); border-radius: 20px; padding: 16px; background: var(--card); display: flex; flex-direction: column; gap: 10px; }
.storycard .t { font-weight: 300; font-size: 19px; line-height: 1.35; }
.srow { font-size: 14px; line-height: 1.45; }
.srow span { display: block; font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.edit { font: inherit; font-size: 12px; color: var(--acc); background: none; border: 0; padding: 0; cursor: pointer; margin-inline-start: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px; text-align: center; background: var(--card); }
.stats b { display: block; font-weight: 200; font-size: 30px; line-height: 1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stats small { font-size: 11px; color: var(--muted); }
.txt { font-size: 16px; line-height: 1.5; color: var(--muted); margin: 0; }
.center { text-align: center; }
.chip { width: 100%; text-align: start; font: inherit; font-size: 15px; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 15px; padding: 13px 15px; display: flex; justify-content: space-between; gap: 10px; align-items: center; cursor: pointer; }
.chip.sel, .chip.rec { border-color: var(--acc); background: var(--soft); }
.chip small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.pill { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--acc); white-space: nowrap; }
.list { display: flex; flex-direction: column; gap: 8px; }
.fieldwrap { position: relative; }
textarea, input[type=text] { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 15px; padding: 13px 15px; outline: none; }
textarea { min-height: 96px; resize: none; line-height: 1.45; }
textarea:focus, input:focus { border-color: var(--acc); }
.fieldwrap textarea, .fieldwrap input { padding-inline-end: 52px; }
.mic { position: absolute; inset-inline-end: 8px; top: 8px; width: 38px; height: 38px; border-radius: 12px; border: 0; background: transparent; color: var(--acc); cursor: pointer; display: grid; place-items: center; }
.mic svg { width: 20px; height: 20px; }
.mic.on { background: var(--grad); color: #fff; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(236,72,153,.15); } }
.btn { width: 100%; font: inherit; font-weight: 500; font-size: 16px; color: #fff; background: var(--grad); border: 0; border-radius: 17px; padding: 16px; cursor: pointer; }
.btn:disabled { opacity: .45; }
.ghost { width: 100%; font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; padding: 10px; cursor: pointer; }
.push { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
.sealed { border-radius: 20px; padding: 18px 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(249,168,212,.45); box-shadow: 0 0 34px rgba(236,72,153,.22); }
.sealed .blur { filter: blur(7px); font-weight: 300; font-size: 17px; line-height: 1.4; user-select: none; }
.row2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.quote { border-radius: 20px; padding: 18px 16px; background: var(--field); border: 1px solid var(--line); font-weight: 300; font-size: 19px; line-height: 1.45; white-space: pre-wrap; }
.box { border-radius: 16px; padding: 13px 15px; background: var(--field); border: 1px solid var(--line); font-size: 14px; line-height: 1.55; }

.tip { background: var(--tipbg); color: var(--tipink); border-radius: 15px; padding: 13px 15px; font-size: 14px; line-height: 1.45; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.t1 { background: #fde0ef; } .t2 { background: #ebe2ff; } .t3 { background: #ffe6d6; } .t4 { background: #dff3ec; }

.copybox { font-size: 12px; word-break: break-all; color: var(--muted); background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 10px; user-select: all; }

  app.querySelectorAll("[data-step-go]").forEach(function (b) { b.onclick = function () { var k = +b.dataset.stepGo, m = M(); if (!m || k < 1 || k > 6) return; keepTyped(); if (k === 1) { V.mid = null; return go("home"); } go(stepScreen(k, m)); }; });
  app.querySelectorAll("[data-nav]").forEach(function (b) { b.onclick = function () { if (b.dataset.nav === "back") { try { history.back(); } catch (e) { goBack(); } } else goFwd(); }; });
  app.querySelectorAll("[data-sendtip]").forEach(function (b) { b.onclick = function () { var tp = (S.tips || []).filter(function (x) { return x.id === b.dataset.sendtip; })[0]; if (!tp) return; tp.sent = true; persist(); send("tip", { id: tp.id, text: tp.text, kind: tp.kind }, tp.kind === "loves" ? "wLoves" : "wTip"); setTimeout(render, 300); }; });
  app.querySelectorAll("[data-deltip]").forEach(function (b) { b.onclick = function () { S.tips = S.tips.filter(function (x) { return x.id !== b.dataset.deltip; }); persist(); render(); }; });
  app.querySelectorAll("[data-edit]").forEach(function (b) { b.onclick = function () { var k = b.dataset.edit.split(":"); V.tmp.editFrom = V.tab; V.tmp.editField = k[0]; if (k[0] === "tip") V.tmp.tipId = k[1]; else V.mid = k[1]; go("edit"); }; });
  app.querySelectorAll("[data-tab]").forEach(function (b) { b.onclick = function () { V.tab = b.dataset.tab; V.tmp.sure = false; V.tmp.restoring = false; go("home"); }; });
  app.querySelectorAll("[data-lang]").forEach(function (b) { b.onclick = function () { saveTyped(); S.lang = b.dataset.lang; persist(); render(); }; });
  app.querySelectorAll("[data-role]").forEach(function (b) { b.onclick = function () { saveTyped(); V.tmp.role = b.dataset.role; render(); }; });
  app.querySelectorAll("[data-mic]").forEach(function (b) { b.onclick = function () { startMic(b, b.dataset.mic); }; });
  app.querySelectorAll("[data-heart]").forEach(function (b) { b.onclick = function () { var m = M(); m.howItWent = val("react"); m.rating = +b.dataset.heart; persist(); render(); }; });
  app.querySelectorAll("[data-feel]").forEach(function (b) { b.onclick = function () { var m = M(), k = +b.dataset.feel; m.feelings = m.feelings || []; var p = m.feelings.indexOf(k); if (p > -1) m.feelings.splice(p, 1); else if (m.feelings.length < 3) m.feelings.push(k); persist(); render(); }; });
  app.querySelectorAll("input[type=text]").forEach(function (i) { i.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); var b = i.closest(".fieldwrap") ? i.closest(".fieldwrap").nextElementSibling : null; if (b && b.classList.contains("btn")) b.click(); } }; });
}
function saveTyped() { if (document.getElementById("me")) S.me = val("me"); if (document.getElementById("partner")) S.partner = val("partner"); }

/* ===================== Start ===================== */
window.addEventListener("popstate", function () { if ((location.hash || "").indexOf("m=") > -1) return; if (V.back.length) goBack(); });
window.addEventListener("hashchange", function () { if (receive()) render(true); });
if (!receive()) V.screen = S.role ? "home" : "welcome";
render(true);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
