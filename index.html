  color-scheme: dark;
}
body.her {

}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }

body[dir="rtl"] { font-family: var(--heb); }
#app { position: relative; max-width: 480px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; overflow: hidden;

  display: flex; flex-direction: column; gap: 12px; }
#app > * { position: relative; }
.orb { position: absolute !important; border-radius: 50%; filter: blur(48px); pointer-events: none; opacity: var(--oo); z-index: 0; }
.o1 { width: 280px; height: 280px; background: var(--o1); top: -80px; inset-inline-start: -90px; }
.o2 { width: 260px; height: 260px; background: var(--o2); top: 180px; inset-inline-end: -120px; }
.calm .orb { opacity: calc(var(--oo) * .4); }

.lab { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--acc); margin: 0; }
body[dir="rtl"] .lab { letter-spacing: .03em; font-size: 12px; }
.mutedlab { color: var(--muted); }
.big { font-weight: 200; font-size: 34px; line-height: 1.08; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.mid { font-weight: 200; font-size: 27px; line-height: 1.15; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
body[dir="rtl"] .big, body[dir="rtl"] .mid { letter-spacing: 0; line-height: 1.18; }
.brand { font-weight: 200; font-size: 44px; line-height: 1; letter-spacing: -.03em; margin: 0; }
.txt { font-size: 14px; line-height: 1.5; color: var(--muted); margin: 0; }
.center { text-align: center; }
.chip { width: 100%; text-align: start; font: inherit; font-size: 15px; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 15px; padding: 13px 15px; display: flex; justify-content: space-between; gap: 10px; align-items: center; cursor: pointer; }
.chip.sel, .chip.rec { border-color: var(--acc); background: var(--soft); }
.chip small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.pill { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--acc); white-space: nowrap; }
.list { display: flex; flex-direction: column; gap: 8px; }
.fieldwrap { position: relative; }
textarea, input[type=text] { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 15px; padding: 13px 15px; outline: none; }

.fieldwrap textarea, .fieldwrap input { padding-inline-end: 52px; }
.mic { position: absolute; inset-inline-end: 8px; top: 8px; width: 38px; height: 38px; border-radius: 12px; border: 0; background: transparent; color: var(--acc); cursor: pointer; display: grid; place-items: center; }

.tabs { display: flex; gap: 6px; background: var(--field); border: 1px solid var(--line); border-radius: 16px; padding: 4px; }

/* ===================== State ===================== */
var KEY = "cah1";
var S = load();
function blank() { return { lang: (navigator.language || "").indexOf("he") === 0 ? "he" : "en", role: null, me: "", partner: "", couple: "", moments: [], draws: [], notes: "", seen: [], introHim: false, introHer: false }; }
function load() { try { var d = JSON.parse(localStorage.getItem(KEY)); if (d && d.moments) return Object.assign(blank(), d); } catch (e) {} return blank(); }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
var V = { screen: "welcome", mid: null, tab: "moments", tmp: {} };
function t(k, n) { var s = T[S.lang][k]; if (s == null) s = T.en[k]; return typeof s === "string" ? s.replace("{n}", n == null ? (S.partner || "") : n) : s; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function byId(id) { for (var i = 0; i < S.moments.length; i++) if (S.moments[i].id === id) return S.moments[i]; return null; }
function M() { return byId(V.mid); }

/* ===================== Links (messages travel after the #) ===================== */
function enc(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function dec(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return JSON.parse(decodeURIComponent(escape(atob(s)))); }
function baseUrl() { return location.origin + location.pathname; }
function send(type, data, waKey) {
  if (!S.couple) S.couple = uid();
  var msg = { v: 1, c: S.couple, id: uid(), t: type, f: S.role, n: S.me, l: S.lang, p: S.partner, d: data };
  var link = baseUrl() + "#m=" + enc(msg);
  persist();
  V.lastLink = link;
  var text = t(waKey) + "\n" + link;
  var wa = "https://wa.me/?text=" + encodeURIComponent(text);
  toast(t("sentNote"));
  var w = null; try { w = window.open(wa, "_blank"); } catch (e) {}
  if (!w) window.location.href = wa;
  return link;
}
function receive() {
  var h = location.hash || "";
  var i = h.indexOf("m=");
  if (i < 0) return false;
  var msg; try { msg = dec(h.slice(i + 2)); } catch (e) { return false; }
  history.replaceState(null, "", baseUrl());
  if (!msg || !msg.t) return false;
  if (S.couple && msg.c !== S.couple) { V.screen = "notice"; V.tmp.notice = t("otherCouple"); return true; }
  var already = S.seen.indexOf(msg.id) > -1;
  if (!S.couple) S.couple = msg.c;
  if (!S.role) { S.role = msg.f === "her" ? "him" : "her"; if (S.lang !== "he" && msg.l) S.lang = msg.l; }
  if (!S.partner && msg.n) S.partner = msg.n;
  if (!S.me && msg.p) S.me = msg.p;
  if (!already) { S.seen.push(msg.id); if (S.seen.length > 300) S.seen = S.seen.slice(-300); apply(msg); }
  else route(msg);
  persist();
  return true;
}
function apply(msg) {
  var d = msg.d || {}, m;
  if (msg.t === "invite" || msg.t === "moment") {
    m = byId(d.mid);
    if (!m) { m = { id: d.mid, title: d.title, from: "her", status: "sealed", createdAt: Date.now() }; S.moments.unshift(m); }
  } else if (msg.t === "question") {
    m = byId(d.mid);
    if (!m) { m = { id: d.mid, title: d.title, from: d.from || "him", createdAt: Date.now() }; S.moments.unshift(m); }
    m.question = d.q; m.status = "asked"; m.title = m.title || d.title;
  } else if (msg.t === "answer") {
    m = byId(d.mid); if (m) { m.answer = d.a; m.status = "answered"; }
  } else if (msg.t === "note" || msg.t === "listened") {
    m = byId(d.mid);
    if (!m) { m = { id: d.mid, title: d.title, from: "him", createdAt: Date.now() }; S.moments.unshift(m); }
    m.status = "listened"; if (d.note) m.note = d.note; m.listenedAt = Date.now();
  } else if (msg.t === "reaction") {
    m = byId(d.mid); if (m) m.reaction = d.text;
  }
  route(msg);
}
function route(msg) {
  var d = msg.d || {};
  V.mid = d.mid;
  if (S.role === "him") {
    if (msg.t === "invite" || msg.t === "moment") V.screen = "sealed";
    else if (msg.t === "answer") V.screen = "learned";
    else V.screen = "home";
  } else {
    if (msg.t === "question") V.screen = S.introHer ? "answer" : "herIntro1";
    else if (msg.t === "note" || msg.t === "listened") V.screen = "listened";
    else V.screen = "home";
  }
}

/* ===================== Voice (speech to text, where the phone supports it) ===================== */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null;
var MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
function field(id, ph, val, tall) {
  var input = tall ? '<textarea id="' + id + '" placeholder="' + esc(ph) + '">' + esc(val || "") + '</textarea>' : '<input type="text" id="' + id + '" placeholder="' + esc(ph) + '" value="' + esc(val || "") + '">';
  return '<div class="fieldwrap">' + input + (SR ? '<button class="mic" type="button" data-mic="' + id + '" aria-label="Speak">' + MIC + '</button>' : "") + '</div>';
}
function startMic(btn, id) {
  if (rec) { try { rec.stop(); } catch (e) {} rec = null; document.querySelectorAll(".mic.on").forEach(function (b) { b.classList.remove("on"); }); return; }
  var box = document.getElementById(id); if (!box) return;
  rec = new SR(); rec.lang = S.lang === "he" ? "he-IL" : "en-US"; rec.interimResults = true; rec.continuous = false;
  var before = box.value ? box.value.replace(/\s+$/, "") + " " : "";
  rec.onresult = function (e) { var s = ""; for (var i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; box.value = before + s; };
  rec.onend = function () { btn.classList.remove("on"); rec = null; };
  rec.onerror = function () { btn.classList.remove("on"); rec = null; };
  btn.classList.add("on");
  try { rec.start(); } catch (e) { btn.classList.remove("on"); rec = null; }
}
function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; }

/* ===================== Pieces ===================== */
function orbs() { return '<i class="orb o1"></i><i class="orb o2"></i>'; }
function dots(n) { var s = ""; for (var i = 0; i < 3; i++) s += '<i class="' + (i === n ? "on" : "") + '"></i>'; return '<div class="dots">' + s + '</div>'; }
function chip(label, act, cls, extra) { return '<button class="chip ' + (cls || "") + '" data-act="' + act + '"><span>' + label + '</span>' + (extra || "") + '</button>'; }
function btn(label, act, dis) { return '<button class="btn" data-act="' + act + '"' + (dis ? " disabled" : "") + '>' + label + '</button>'; }

function lc(s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : ""; }
function pillFor(m) {

SC.words = function () { var m = M(); return { cls: "calm", html: orbs() + '<p class="lab">5 / 6</p><p class="mid">' + t("m5b") + '</p><p class="txt">' + t("seeQ") + '</p>' + field("see", t("seePh"), m.see, true) + '<p class="txt">' + t("knowQ") + '</p>' + field("know", t("knowPh"), m.know, true) + '<div class="push">' + btn(t("next"), "saveWords") + '</div>' }; };
SC.say = function () {
  var m = M(); var f = (m.feelings || []).map(function (i) { return "<b>" + t("feelings")[i] + "</b>"; }).join(S.lang === "he" ? " ו" : " and ");
  var r = (f ? t("youFelt") + " " + f + ". " : "") + (m.see ? t("youSee") + ": " + esc(m.see) + ". " : "") + (m.know ? t("youWant") + ": " + esc(m.know) + "." : "");
  return { cls: "calm", html: orbs() + '<p class="lab">5 / 6</p><p class="mid">' + t("m5c") + '</p>' + (r ? '<div class="box">' + r + '</div>' : "") + '<div class="tip">' + t("tip") + '</div><p class="lab mutedlab">' + t("tellLab") + '</p>' +
    chip(t("tell1"), "tellPerson", "rec", '<span class="pill">' + t("best") + '</span>') + chip(t("tell2"), "tellNote", "", "<small>" + t("tell2s") + "</small>") + chip(t("tell3"), "tellLater", "", "<small>" + t("tell3s") + "</small>") };
};
SC.note = function () { var m = M(); return { cls: "calm", html: orbs() + '<p class="lab">5 / 6</p><p class="mid">' + t("noteQ") + '</p>' + field("noteTxt", t("notePh"), m.noteDraft, true) + '<div class="push">' + btn(t("sendNote"), "sendNote") + '</div>' }; };
SC.rate = function () {
  var m = M(), r = m.rating || 0, hs = "";
  for (var i = 1; i <= 5; i++) hs += '<button data-heart="' + i + '" class="' + (i <= r ? "on" : "") + '" aria-label="' + i + '">♥</button>';
  return { cls: "calm", html: orbs() + '<p class="lab">6 / 6</p><p class="mid">' + t("m6") + '</p><div class="hearts">' + hs + '</div>' + field("react", t("whatPh"), m.howItWent, true) + '<div class="push">' + (m.toldHow === "person" ? chip(t("letHer"), "sendListened") : "") + btn(t("finish"), "finishRate", !r) + '</div>' };
};
/* --- her side --- */
SC.herIntro1 = function () { return { cls: "", html: orbs() + '<div class="top"><span></span><button class="iconbtn" data-act="herIntroDone">' + t("skip") + '</button></div><p class="icon">♡</p><div class="push"><p class="big">' + t("hi1") + '</p>' + dots(0) + btn(t("continueBtn"), "herIntro2") + '</div>' }; };
SC.herIntro2 = function () { return { cls: "", html: orbs() + '<div class="top"><span></span><button class="iconbtn" data-act="herIntroDone">' + t("skip") + '</button></div><p class="icon">💬</p><div class="push"><p class="big">' + t("hi2") + '</p>' + dots(1) + btn(t("continueBtn"), "herIntro3") + '</div>' }; };
SC.herIntro3 = function () { return { cls: "", html: orbs() + '<p class="icon">🔒</p><div class="push"><p class="big">' + t("hi3") + '</p><p class="txt">' + t("hi3s") + '</p>' + dots(2) + btn(t("seeQBtn"), "herIntroDone") + '</div>' }; };
SC.herHome = function () {
  if (V.tab === "settings") return SC.settings();
  var asked = S.moments.filter(function (m) { return m.status === "asked"; });
  var listened = S.moments.filter(function (m) { return m.status === "listened"; });
  var mine = S.moments.filter(function (m) { return m.from === "her" && m.status !== "asked" && m.status !== "listened"; });
  var h = orbs() + tabs() + '<p class="mid">' + t("hHome") + '</p>' +
    (asked.length || listened.length ? '<div class="list">' + asked.map(function (m) { return chip(esc(m.question), "answer:" + m.id, "rec", '<span class="pill">♡</span>'); }).join("") + listened.map(function (m) { return chip(t("hListened") + (m.note ? " · ✉" : ""), "listened:" + m.id, "", ""); }).join("") + '</div>' : '<div class="empty">' + t("hNone") + '</div>') +
    '<p class="lab" style="margin-top:6px">' + t("hAddL") + '</p>' + field("herMoment", t("hAddPh"), "", false) + btn(t("send"), "herAddMoment") +
    (mine.length ? '<p class="lab mutedlab">' + t("hMyMoments") + '</p><div class="list">' + mine.map(function (m) { return '<div class="chip" style="cursor:default"><span>' + esc(m.title) + '</span><span class="pill">🔒</span></div>'; }).join("") + '</div>' : "") +
    '<p class="lab" style="margin-top:6px">🔒 ' + t("hNotes") + '</p><textarea id="notes" placeholder="' + esc(t("hNotesPh")) + '">' + esc(S.notes) + '</textarea>' + ghost(t("saveNotes"), "saveNotes");
  return { cls: "calm", html: h };
};
SC.answer = function () { var m = M(); if (!m) return SC.home(); return { cls: "calm", html: orbs() + '<p class="lab">' + esc(t("hFrom")) + '</p><p class="mid">' + esc(m.question) + '</p>' + field("herAns", t("hAnsPh"), m.answer, true) + '<div class="push">' + btn(t("send"), "sendAnswer") + ghost("‹ " + t("backHome"), "home") + '</div>' }; };
SC.listened = function () {
  var m = M(); if (!m) return SC.home();
  return { cls: "", html: orbs() + '<p class="big">' + t("hListened") + '</p>' + (m.title ? '<p class="txt">' + esc(m.title) + '</p>' : "") + (m.note ? '<p class="lab mutedlab">' + esc(t("noteFrom")) + '</p><div class="quote">' + esc(m.note) + '</div>' : "") +
    '<p class="lab mutedlab">' + t("react") + '</p>' + field("reactTxt", t("reactPh"), m.reaction, true) + ghost(t("react") + " ›", "sendReaction") +
    '<div class="push">' + btn(t("addMore"), "home") + '<p class="txt center" style="font-size:12px">' + t("addMoreS") + '</p></div>' };
};
function copyLinkBlock() { return V.lastLink ? '<p class="lab mutedlab">' + t("copyLink") + '</p><div class="copybox" data-act="copyLink">' + esc(V.lastLink) + '</div>' : ""; }

/* ===================== Actions ===================== */
var A = {
  startApp: function () {
    S.role = V.tmp.role; S.me = val("me"); S.partner = val("partner"); if (!S.couple) S.couple = uid(); persist();
    if (S.role === "her") go("herFirst"); else go(S.introHim ? "home" : "intro1");
  },
  home: function () { V.mid = null; go("home"); },
  herFirstNext: function () { var v = val("first"); if (!v) return; var m = { id: uid(), title: v, from: "her", status: "sent", createdAt: Date.now() }; S.moments.unshift(m); V.mid = m.id; persist(); go("herInvite"); },
  sendInvite: function () { var m = M(); S.invited = true; send("invite", { mid: m.id, title: m.title }, "wInvite"); setTimeout(function () { go("home"); }, 400); },
  toGuess: function () { go("guess"); },
  doReveal: function () { var m = M(); m.guess = val("guess"); m.status = "new"; V.tmp.score = null; persist(); go("reveal"); },
  scoreYes: function () { V.tmp.score = "yes"; M().guessed = true; persist(); go("reveal"); },
  scoreNo: function () { V.tmp.score = "no"; persist(); go("reveal"); },
  afterReveal: function () { if (!S.introHim) go("intro1"); else go("ask"); },
  intro2: function () { go("intro2"); }, intro3: function () { go("intro3"); },
  introDone: function () { S.introHim = true; persist(); if (V.mid && byId(V.mid) && byId(V.mid).from === "her") go("ask"); else { V.mid = null; go("home"); } },
  addOwn: function () { var v = val("own"); if (!v) return; addMoment(v); },
  iKnow: function () { var m = M(); m.why = val("why"); persist(); go("learned"); },
  iDont: function () { var m = M(); var w = val("why"); if (w) m.why = w; persist(); go("ask"); },
  askInPerson: function () { var m = M(); m.question = val("q"); m.askedHow = "person"; persist(); go("record"); },
  askSend: function () { var m = M(); m.question = val("q"); m.askedHow = "link"; m.status = "asked"; persist(); send("question", { mid: m.id, title: m.title, q: m.question, from: m.from }, "wQuestion"); setTimeout(function () { go("sent"); }, 300); },
  saveRecord: function () { var m = M(); var a = val("ans"); if (!a) return; m.answer = a; m.status = "answered"; persist(); go("learned"); },
  saveLearned: function () { var m = M(); var d = val("draw"); if (d) { if (m.draw) S.draws = S.draws.filter(function (x) { return x !== m.draw; }); m.draw = d; S.draws.unshift(d); } persist(); go("feel"); },
  toWords: function () { go("words"); },
  saveWords: function () { var m = M(); m.see = val("see"); m.know = val("know"); persist(); go("say"); },
  tellPerson: function () { var m = M(); m.toldHow = "person"; persist(); go("rate"); },
  tellNote: function () { go("note"); },
  tellLater: function () { var m = M(); m.status = "saved"; persist(); toast(t("savedToast")); V.mid = null; go("home"); },
  sendNote: function () { var m = M(); var n = val("noteTxt"); if (!n) return; m.noteDraft = n; m.toldHow = "note"; persist(); send("note", { mid: m.id, title: m.title, note: n }, "wNote"); setTimeout(function () { go("rate"); }, 300); },
  sendListened: function () { var m = M(); send("listened", { mid: m.id, title: m.title }, "wListened"); },
  finishRate: function () { var m = M(); m.howItWent = val("react"); m.status = "done"; persist(); toast(t("savedToast")); V.mid = null; go("home"); },
  sendAnswer: function () { var m = M(); var a = val("herAns"); if (!a) return; m.answer = a; m.status = "answeredByMe"; persist(); send("answer", { mid: m.id, a: a }, "wAnswer"); setTimeout(function () { V.mid = null; go("home"); }, 300); },
  sendReaction: function () { var m = M(); var r = val("reactTxt"); if (!r) return; m.reaction = r; persist(); send("reaction", { mid: m.id, text: r }, "wReaction"); },
  herAddMoment: function () { var v = val("herMoment"); if (!v) return; var m = { id: uid(), title: v, from: "her", status: "sent", createdAt: Date.now() }; S.moments.unshift(m); persist(); var first = !S.invited; S.invited = true; send(first ? "invite" : "moment", { mid: m.id, title: v }, first ? "wInvite" : "wMoment"); setTimeout(render, 300); },
  saveNotes: function () { S.notes = document.getElementById("notes").value; persist(); toast(t("savedToast")); },
  herIntro2: function () { go("herIntro2"); }, herIntro3: function () { go("herIntro3"); },
  herIntroDone: function () { S.introHer = true; persist(); if (V.mid && byId(V.mid) && byId(V.mid).status === "asked") go("answer"); else go("home"); },
  saveNames: function () { S.me = val("me"); S.partner = val("partner"); persist(); toast(t("savedToast")); },
  backup: function () { var b = enc(S); copy(b); },
  restoreOpen: function () { V.tmp.restoring = true; render(); },
  doRestore: function () { try { var d = dec(val("restore")); if (d && d.moments) { S = Object.assign(blank(), d); persist(); V.tmp.restoring = false; toast(t("savedToast")); go("home"); } } catch (e) {} },
  askReset: function () { V.tmp.sure = true; render(); }, cancelReset: function () { V.tmp.sure = false; render(); },
  doReset: function () { try { localStorage.removeItem(KEY); } catch (e) {} S = blank(); V = { screen: "welcome", mid: null, tab: "moments", tmp: {} }; render(); },
  copyLink: function () { copy(V.lastLink); }
};
function addMoment(title) { var m = { id: uid(), title: title, from: "him", status: "new", createdAt: Date.now() }; S.moments.unshift(m); V.mid = m.id; persist(); go("why"); }
function openMoment(id) {
  var m = byId(id); V.mid = id; if (!m) return;
  var s = { sealed: "sealed", asked: "sent", answered: "learned", saved: "say", done: "rate" }[m.status] || "why";
  if (m.status === "asked") V.lastLink = null;
  go(s);
}
function copy(s) {
  if (!s) return;
  var done = function () { toast(t("copied")); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, function () { fallbackCopy(s); done(); });
  else { fallbackCopy(s); done(); }
}
function fallbackCopy(s) { var a = document.createElement("textarea"); a.value = s; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch (e) {} a.remove(); }
var toastTimer;
function toast(s) { var e = document.querySelector(".toast"); if (!e) { e = document.createElement("div"); e.className = "toast"; document.body.appendChild(e); } e.textContent = s; clearTimeout(toastTimer); toastTimer = setTimeout(function () { e.remove(); }, 1800); }

/* ===================== Render ===================== */
var app = document.getElementById("app");
function go(s) { V.screen = s; render(true); window.scrollTo(0, 0); }
function render(anim) {
  if (!S.role && V.screen !== "welcome" && V.screen !== "notice") V.screen = "welcome";
  var f = SC[V.screen] || SC.home;
  var s = f();
  document.body.className = S.role === "her" || (!S.role && V.tmp.role === "her") ? "her" : "";
  document.body.dir = S.lang === "he" ? "rtl" : "ltr";
  document.documentElement.lang = S.lang;
  var meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = document.body.className === "her" ? "#fdfbfe" : "#0d0d12";
  app.className = (s.cls || "") + (anim ? " anim" : "");
  app.innerHTML = s.html;
  bind();
}
function bind() {
  app.querySelectorAll("[data-act]").forEach(function (b) {
    b.onclick = function () {
      var a = b.getAttribute("data-act"), k = a.split(":");
      if (k[0] === "open") return openMoment(k[1]);
      if (k[0] === "answer") { V.mid = k[1]; return go(S.introHer ? "answer" : "herIntro1"); }
      if (k[0] === "listened") { V.mid = k[1]; return go("listened"); }
      if (k[0] === "addSug") return addMoment(t(k[1]));
      if (A[a]) A[a]();
    };
  });
  app.querySelectorAll("[data-tab]").forEach(function (b) { b.onclick = function () { V.tab = b.dataset.tab; V.tmp.sure = false; V.tmp.restoring = false; go("home"); }; });
  app.querySelectorAll("[data-lang]").forEach(function (b) { b.onclick = function () { saveTyped(); S.lang = b.dataset.lang; persist(); render(); }; });
  app.querySelectorAll("[data-role]").forEach(function (b) { b.onclick = function () { saveTyped(); V.tmp.role = b.dataset.role; render(); }; });
  app.querySelectorAll("[data-mic]").forEach(function (b) { b.onclick = function () { startMic(b, b.dataset.mic); }; });
  app.querySelectorAll("[data-heart]").forEach(function (b) { b.onclick = function () { var m = M(); m.howItWent = val("react"); m.rating = +b.dataset.heart; persist(); render(); }; });
  app.querySelectorAll("[data-feel]").forEach(function (b) { b.onclick = function () { var m = M(), k = +b.dataset.feel; m.feelings = m.feelings || []; var p = m.feelings.indexOf(k); if (p > -1) m.feelings.splice(p, 1); else if (m.feelings.length < 3) m.feelings.push(k); persist(); render(); }; });
  app.querySelectorAll("input[type=text]").forEach(function (i) { i.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); var b = i.closest(".fieldwrap") ? i.closest(".fieldwrap").nextElementSibling : null; if (b && b.classList.contains("btn")) b.click(); } }; });
}
function saveTyped() { if (document.getElementById("me")) S.me = val("me"); if (document.getElementById("partner")) S.partner = val("partner"); }

/* ===================== Start ===================== */
window.addEventListener("hashchange", function () { if (receive()) render(true); });
if (!receive()) V.screen = S.role ? "home" : "welcome";
render(true);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
